<title>ワンドライ 広告運用ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 運用ボード：上から「流れ（過去3週間＋次の7日）」→「パックの地図」→「作る動画（台本と素材）」。承認と納品は動画のカードの中 */
:root{
  --paper:#f6f4ef; --card:#fffdf9; --ink:#1f2a33; --sub:#5d6873; --line:#e2ddd2; --wash:#efebe2; --grid:#e9e4da;
  --accent:#1f6f5c; --accent-wash:#e3f0eb; --spend:#c9bfa8; --future:#eef3f1;
  --ok:#1f7a4d; --ok-wash:#e2f3e9; --warn:#a86a00; --warn-wash:#fbefd8; --bad:#b23a2e; --bad-wash:#f8e3df;
  --ai:#6b46c1; --ai-wash:#efe8fb; --yt:#c0392b; --yt-wash:#fbe9e6; --own:#2c6e9b; --own-wash:#e4eff7; --free:#2f7d6b; --free-wash:#e0f1ec; --edit:#7a6a3a; --edit-wash:#f2eddc;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151b20; --card:#1c242a; --ink:#e8ecee; --sub:#a3adb5; --line:#2f3a42; --wash:#222c33; --grid:#29343b;
  --accent:#5cc3a6; --accent-wash:#1c3a33; --spend:#5b5444; --future:#1a2a27;
  --ok:#5cc98f; --ok-wash:#173327; --warn:#e3a943; --warn-wash:#3a2e17; --bad:#ef7a6c; --bad-wash:#3d211e;
  --ai:#b39af0; --ai-wash:#2c2440; --yt:#f08a7d; --yt-wash:#3b2220; --own:#7fb7e0; --own-wash:#1d2f3d; --free:#6fd0b8; --free-wash:#173530; --edit:#d6c48f; --edit-wash:#33301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151b20; --card:#1c242a; --ink:#e8ecee; --sub:#a3adb5; --line:#2f3a42; --wash:#222c33; --grid:#29343b;
  --accent:#5cc3a6; --accent-wash:#1c3a33; --spend:#5b5444; --future:#1a2a27;
  --ok:#5cc98f; --ok-wash:#173327; --warn:#e3a943; --warn-wash:#3a2e17; --bad:#ef7a6c; --bad-wash:#3d211e;
  --ai:#b39af0; --ai-wash:#2c2440; --yt:#f08a7d; --yt-wash:#3b2220; --own:#7fb7e0; --own-wash:#1d2f3d; --free:#6fd0b8; --free-wash:#173530; --edit:#d6c48f; --edit-wash:#33301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.brand{font-family:var(--display);font-weight:900;font-size:17px}
.brand small{font-weight:500;color:var(--sub);font-size:12px;margin-left:8px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-size:12.5px;color:var(--sub);text-decoration:none;padding:3px 10px;border-radius:999px}
.nav a:hover{background:var(--wash);color:var(--ink)}
.counts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cnt{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--wash);color:var(--sub);font-variant-numeric:tabular-nums;border:0;font-family:inherit;cursor:pointer}
.cnt b{color:var(--ink);font-size:13px;margin-left:4px}
.cnt[aria-pressed="true"]{outline:2px solid var(--accent)}
.hero{padding-block:26px 6px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--sub);font-family:var(--display);font-weight:700}
.hero h1{font-size:24px;font-weight:900;margin-top:6px;max-width:44em}
.stop{margin-top:12px;display:flex;gap:10px;align-items:flex-start;background:var(--warn-wash);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;max-width:60em}
.stop b{color:var(--warn);white-space:nowrap}
section{margin-top:34px;scroll-margin-top:70px}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{font-size:18px;font-weight:900}
.sh span{color:var(--sub);font-size:12.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-family:var(--display);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.kpi .d.bad{color:var(--bad)} .kpi .d.good{color:var(--ok)}
.chartbox{overflow-x:auto}
svg.chart{display:block;width:100%;min-width:720px;height:auto}
svg.chart text{font-family:var(--body);font-size:11px;fill:var(--sub)}
svg.chart .ttl{font-family:var(--display);font-weight:700;fill:var(--ink);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);align-items:center;margin-top:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.events{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.events li{display:flex;gap:10px}
.events .n{font-family:var(--mono);font-size:12px;color:var(--paper);background:var(--ink);border-radius:999px;width:20px;height:20px;display:grid;place-items:center;flex:none;margin-top:2px}
.events .dt{font-family:var(--mono);font-size:12px;color:var(--sub);white-space:nowrap;margin-top:2px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.wd{border-radius:10px;padding:10px 12px;font-size:12.5px;background:var(--future);border:1px solid var(--line)}
.wd b{display:block;font-family:var(--mono);font-size:12px;color:var(--ink)}
.wd i{font-style:normal;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px}
.wd.make i{background:var(--accent-wash);color:var(--accent)} .wd.run i{background:var(--ok-wash);color:var(--ok)} .wd.check i{background:var(--warn-wash);color:var(--warn)}
.wd.today{border-color:var(--accent);border-width:2px}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pack{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pack.empty{border-style:dashed}
.pack .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pid{font-family:var(--mono);font-size:12px;color:var(--sub)}
.pack h3{font-size:15.5px;font-weight:700}
.pack p{margin:0;font-size:13px;color:var(--sub)}
.flag{font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px}
.flag.ok{background:var(--ok-wash);color:var(--ok)} .flag.warn{background:var(--warn-wash);color:var(--warn)} .flag.bad{background:var(--bad-wash);color:var(--bad)}
.plist{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:12.5px;align-items:center}
.plist a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--sub)}
.plist .m{font-family:var(--mono);font-size:11.5px;color:var(--sub);white-space:nowrap}
.st{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;white-space:nowrap}
.st-delivered,.st-checked{background:var(--ok-wash);color:var(--ok)} .st-approved,.st-producing{background:var(--accent-wash);color:var(--accent)}
.st-script{background:var(--wash);color:var(--sub)} .st-hold{background:var(--warn-wash);color:var(--warn)} .st-rejected{background:var(--bad-wash);color:var(--bad)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.adlist{display:flex;flex-direction:column;gap:14px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:70px}
.adhead{padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.adno{font-family:var(--mono);font-size:12px;color:var(--sub)}
.adhead h3{font-size:18px;font-weight:900;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:12.5px;color:var(--sub)}
.meta b{color:var(--ink);font-weight:700}
.layer{margin-top:8px;font-size:13px;background:var(--wash);border-radius:9px;padding:7px 11px}
.ready .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.ready .lab b{color:var(--ink);font-family:var(--display)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--wash);margin:5px 0 6px}
.bar i{display:block;height:100%}
.kinds{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:700;border-radius:5px;padding:0 7px;white-space:nowrap}
.k-own{background:var(--own-wash);color:var(--own)} .k-free{background:var(--free-wash);color:var(--free)} .k-comp{background:var(--own-wash);color:var(--own)}
.k-youtube{background:var(--yt-wash);color:var(--yt)} .k-ai{background:var(--ai-wash);color:var(--ai)} .k-edit{background:var(--edit-wash);color:var(--edit)} .k-avatar{background:var(--accent-wash);color:var(--accent)}
.decide{padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line)}
.decide .q{font-family:var(--display);font-weight:700;font-size:13px;margin-right:2px}
.btn{font:inherit;font-weight:700;font-size:12.5px;border-radius:9px;padding:6px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:focus-visible,.cnt:focus-visible,.filters button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn.hold[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.btn.ng[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.btn[disabled]{opacity:.5;cursor:default}
.memo{flex:1 1 240px;min-width:0;display:flex}
.memo textarea{flex:1;min-width:0;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--paper);color:var(--ink);resize:vertical;min-height:34px}
.dstate{font-size:12px;color:var(--sub);width:100%}
.deliv{padding:14px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.player video{width:100%;max-width:100%;aspect-ratio:4/5;background:#000;border-radius:10px;display:block}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.parts button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.parts button[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.deliv h4{margin:0;font-family:var(--display);font-size:14px}
.deliv p{margin:6px 0 0;color:var(--sub);font-size:13px}
details.script{border-top:1px solid var(--line)}
details.script>summary{list-style:none;cursor:pointer;padding:10px 18px;font-family:var(--display);font-weight:700;font-size:13.5px}
details.script>summary::-webkit-details-marker{display:none}
details.script>summary::before{content:"▸ ";color:var(--sub)}
details.script[open]>summary::before{content:"▾ "}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:700;font-size:12px;color:var(--sub);background:var(--wash);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.t{font-family:var(--mono);font-size:12px;color:var(--sub);white-space:nowrap}
td.sec{font-size:12px;color:var(--sub);white-space:nowrap}
td.line{min-width:240px}
td.vis{min-width:140px;font-size:12.5px;color:var(--sub)}
td.as{min-width:230px;width:260px}
td.made img{width:90px;border-radius:6px;display:block;aspect-ratio:4/5;object-fit:cover}
.asset{display:flex;gap:10px;align-items:flex-start}
.asset img{width:64px;height:64px;object-fit:cover;border-radius:7px;flex:none;background:var(--wash)}
.asset .ph{width:64px;height:64px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;text-align:center;line-height:1.3;padding:4px}
.asset .tx{min-width:0;font-size:12px}
.asset .lbl{display:block;margin-top:2px}
.asset .rs{display:block;color:var(--sub);margin-top:2px}
.asset.ai .rs{color:var(--ai)}
.body{padding:10px 18px 14px;font-size:13px;color:var(--sub);white-space:pre-wrap;border-top:1px solid var(--line)}
.win{width:100%}
.win td,.win th{padding:6px 10px;font-size:12.5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.empty{padding:40px 0;color:var(--sub)}
@media (max-width:820px){.adhead{grid-template-columns:1fr}.deliv{grid-template-columns:1fr}.counts{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">ワンドライ<small>広告運用ボード</small></div>
  <nav class="nav"><a href="#flow">流れ</a><a href="#packs">パック</a><a href="#make">作る動画</a></nav>
  <div class="counts" id="counts"></div>
</div></header>

<main class="wrap" id="app"><div class="empty">広告の数字と作る動画を読み込んでいます。claude.ai で開くと、承認ボタンと納品の動画が使えます。</div></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const KIND = {own:'自社の素材庫', comp:'参考広告の素材', free:'フリー素材', youtube:'YouTubeで探す', ai:'AIで生成', edit:'編集で作る', avatar:'口パク（HeyGen）'};
const READY = ['own','comp','free','edit','avatar'];
const KCOL = {own:'var(--own)', comp:'var(--own)', free:'var(--free)', edit:'var(--edit)', avatar:'var(--accent)', youtube:'var(--yt)', ai:'var(--ai)'};
const STL = {script:'台本のみ', approved:'承認済み', producing:'制作中', delivered:'納品', checked:'確認済み', hold:'保留', rejected:'見送り'};
const state = {ov:null, items:{}, dec:{}, filter:'all', db:null, canWrite:null, uid:null, part:{}};

function eff(a){ const d = state.dec[a.key]?.verdict;
  if (a.status === 'script') { if (d === 'approve') return 'approved'; if (d === 'hold') return 'hold'; if (d === 'reject') return 'rejected'; }
  return a.status; }
function kinds(a){ const c = {}; a.rows.forEach(r => c[r.asset.kind] = (c[r.asset.kind] || 0) + 1); return c; }

function chart(series, plan){
  // 過去（実データ）＋これからの7日を1本の時間軸に
  const past = series.filter(s => s.spend > 0 || s.buy > 0);
  const last = new Date(series[series.length - 1].d);
  const fut = []; for (let i = 1; i <= 7; i++) { const t = new Date(last); t.setDate(t.getDate() + i); fut.push(t.toISOString().slice(0, 10)); }
  const all = series.map(s => s.d).concat(fut);
  const W = 1100, L = 56, R = 56, T = 26, H1 = 150, G = 36, H2 = 120, B = 34, H = T + H1 + G + H2 + B;
  const x = i => L + (W - L - R) * (i + .5) / all.length, bw = (W - L - R) / all.length * .62;
  const maxS = Math.max(...series.map(s => s.spend)) * 1.1, maxB = Math.max(...series.map(s => s.buy)) * 1.15;
  const ys = v => T + H1 - H1 * v / maxS, yb = v => T + H1 - H1 * v / maxB;
  const cpa = series.map(s => (s.buy && s.spend) ? s.spend / s.buy : null), roas = series.map(s => s.spend ? s.rev / s.spend : null);  // 広告費0の日（停止中の遅れて付いた購入）は線に入れない
  const maxC = 25000, y2 = v => T + H1 + G + H2 - H2 * Math.min(v, maxC) / maxC;
  const maxR = 6, yr = v => T + H1 + G + H2 - H2 * v / maxR;
  const iToday = all.indexOf(plan.today);
  let g = '';
  // これからの帯
  const fx = x(series.length) - (W - L - R) / all.length / 2;
  g += `<rect x="${fx}" y="${T - 14}" width="${W - R - fx}" height="${H1 + G + H2 + 14}" fill="var(--future)"/>`;
  g += `<text x="${fx + 6}" y="${T - 2}" class="ttl">これから（計画）</text>`;
  // 目盛り
  [0, .5, 1].forEach(f => { const v = maxS * f / 1.1; g += `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--grid)"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${Math.round(v / 10000)}万</text>`; });
  [0, 7800, 15600, 25000].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y2(v)}" y2="${y2(v)}" stroke="var(--grid)" ${v === 7800 ? 'stroke-dasharray="0"' : ''}/><text x="${L - 6}" y="${y2(v) + 4}" text-anchor="end">${v ? (v / 1000).toFixed(1).replace('.0', '') + '千' : '0'}</text>`; });
  [0, 2, 4, 6].forEach(v => { g += `<text x="${W - R + 6}" y="${yr(v) + 4}">${v.toFixed(0)}</text>`; });
  g += `<text x="${L}" y="${T - 2}" class="ttl">広告費（棒）と購入件数（線）</text>`;
  g += `<text x="${L}" y="${T + H1 + G - 8}" class="ttl">CPA（線・左）と ROAS（点線・右）</text>`;
  // 目標CPA・切るライン
  g += `<line x1="${L}" x2="${W - R}" y1="${y2(plan.target_cpa)}" y2="${y2(plan.target_cpa)}" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="${fx - 6}" y="${y2(plan.target_cpa) - 4}" text-anchor="end" style="fill:var(--ok)">目標CPA ${yen(plan.target_cpa)}</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${y2(plan.cut_cpa)}" y2="${y2(plan.cut_cpa)}" stroke="var(--bad)" stroke-dasharray="2 4"/><text x="${fx - 6}" y="${y2(plan.cut_cpa) - 4}" text-anchor="end" style="fill:var(--bad)">止める目安 ${yen(plan.cut_cpa)}</text>`;
  // 棒と線
  series.forEach((s, i) => { if (s.spend) g += `<rect x="${x(i) - bw / 2}" y="${ys(s.spend)}" width="${bw}" height="${T + H1 - ys(s.spend)}" fill="var(--spend)" rx="2"><title>${s.d} 広告費 ${yen(s.spend)}</title></rect>`; });
  const pl = (arr, yf) => arr.map((v, i) => v == null ? null : [x(i), yf(v)]).filter(Boolean).map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const pbuy = series.map((s, i) => s.spend ? s.buy : null);
  g += `<path d="${pl(pbuy, yb)}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  series.forEach((s, i) => { if (s.spend) g += `<circle cx="${x(i)}" cy="${yb(s.buy)}" r="3" fill="var(--ink)"><title>${s.d} 購入 ${s.buy}件</title></circle>`; });
  g += `<path d="${pl(cpa, y2)}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  g += `<path d="${pl(roas, yr)}" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  cpa.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i)}" cy="${y2(v)}" r="2.6" fill="var(--accent)"><title>${series[i].d} CPA ${yen(v)}・ROAS ${roas[i] != null ? roas[i].toFixed(2) : '—'}</title></circle>`; });
  // 出来事
  (state.ov.events || []).forEach((e, k) => { const i = all.indexOf(e.d); if (i < 0) return;
    g += `<line x1="${x(i)}" x2="${x(i)}" y1="${T - 10}" y2="${T + H1 + G + H2}" stroke="var(--ink)" stroke-opacity=".35" stroke-dasharray="2 3"/><circle cx="${x(i)}" cy="${T - 10}" r="8" fill="var(--ink)"/><text x="${x(i)}" y="${T - 6}" text-anchor="middle" style="fill:var(--paper);font-family:var(--mono);font-size:10px">${k + 1}</text>`; });
  // 日付
  all.forEach((d, i) => { const dt = new Date(d); if (i % 2 === 0 || i === iToday) g += `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" ${i === iToday ? 'style="fill:var(--accent);font-weight:700"' : ''}>${dt.getMonth() + 1}/${dt.getDate()}</text>`; });
  if (iToday >= 0) g += `<text x="${x(iToday)}" y="${H}" text-anchor="middle" style="fill:var(--accent);font-weight:700">今日</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 4}" role="img" aria-label="広告費・購入件数・CPA・ROASの推移と今後7日">${g}</svg>`;
}
function weekSum(series, from, to){ const s = series.filter(r => r.d >= from && r.d <= to); const sp = s.reduce((a, r) => a + r.spend, 0), b = s.reduce((a, r) => a + r.buy, 0), rv = s.reduce((a, r) => a + r.rev, 0); return {sp, b, rv, cpa: b ? sp / b : 0, roas: sp ? rv / sp : 0}; }

function assetCell(a){ const k = a.kind;
  const img = a.img ? `<img src="${esc(a.img)}" alt="" loading="lazy">` : `<div class="ph k-${k}">${esc(KIND[k])}</div>`;
  const rs = k === 'ai' ? `AIで生成します。なぜなら、${esc(a.reason)}` : esc(a.reason || '');
  return `<div class="asset ${k}">${img}<div class="tx"><span class="chip k-${k}">${esc(KIND[k])}</span><span class="lbl">${esc(a.label)}</span>${rs ? `<span class="rs">${rs}</span>` : ''}</div></div>`; }
function readyBlock(a){ const c = kinds(a), n = a.rows.length, ok = READY.reduce((s, k) => s + (c[k] || 0), 0);
  const order = ['own','comp','free','edit','avatar','youtube','ai'];
  return `<div class="ready"><div class="lab"><span>素材のそろい具合</span><b>${ok}/${n}行 そろっている</b></div>
    <div class="bar">${order.filter(k => c[k]).map(k => `<i style="width:${100 * c[k] / n}%;background:${KCOL[k]}" title="${KIND[k]} ${c[k]}"></i>`).join('')}</div>
    <div class="kinds">${order.filter(k => c[k]).map(k => `<span class="chip k-${k}">${KIND[k]} ${c[k]}</span>`).join('')}</div>
    ${(c.youtube || c.ai) ? `<div class="dstate" style="margin-top:4px">足りない：${c.youtube ? `YouTubeで探す ${c.youtube}行` : ''}${c.youtube && c.ai ? '・' : ''}${c.ai ? `AI生成 ${c.ai}行` : ''}</div>` : ''}</div>`; }
function adCard(a){
  const st = eff(a), d = state.dec[a.key] || {}, v = d.verdict, P = state.ov.packs.find(p => p.id === a.pack) || {};
  const hasMade = a.rows.some(r => r.made), can = state.db && state.canWrite !== false;
  const rows = a.rows.map(r => `<tr><td class="t">${esc(r.t)}</td><td class="sec">${esc(r.sec)}</td><td class="line">${esc(r.line)}</td><td class="vis">${esc(r.vis)}</td>${hasMade ? `<td class="made">${r.made ? `<img src="${esc(r.made)}" alt="" loading="lazy">` : ''}</td>` : ''}<td class="as">${assetCell(r.asset)}</td></tr>`).join('');
  const decide = a.status === 'script' ? `<div class="decide"><span class="q">この動画を作る？</span>
      <button class="btn ok" data-v="approve" data-id="${esc(a.key)}" aria-pressed="${v === 'approve'}" ${can ? '' : 'disabled'}>承認して制作</button>
      <button class="btn hold" data-v="hold" data-id="${esc(a.key)}" aria-pressed="${v === 'hold'}" ${can ? '' : 'disabled'}>保留</button>
      <button class="btn ng" data-v="reject" data-id="${esc(a.key)}" aria-pressed="${v === 'reject'}" ${can ? '' : 'disabled'}>見送り</button>
      <div class="memo"><textarea id="memo-${esc(a.key)}" rows="1" placeholder="直してほしい所（例：冒頭を孫のセリフから）" ${can ? '' : 'disabled'}>${esc(d.note || '')}</textarea></div>
      <div class="dstate">${d.at ? `${STL[st] || ''}：${esc(new Date(d.at).toLocaleString('ja-JP'))}` : (can ? '承認すると Claude が制作して、このカードに納品します。' : 'claude.ai で開くと承認できます。')}</div></div>` : '';
  const vids = a.video || [], pi = state.part[a.key] || 0;
  const deliv = vids.length ? `<div class="deliv"><div class="player"><video id="vid-${esc(a.key)}" controls playsinline preload="metadata" src="${esc(vids[pi][1])}"></video>
      <div class="parts">${vids.map((p, k) => `<button data-part="${k}" data-id="${esc(a.key)}" aria-pressed="${k === pi}">${esc(p[0])}</button>`).join('')}</div></div>
      <div><h4>納品</h4><p>${esc(a.delivered_note)}</p><p>台本の「完成画」で行ごとの仕上がりを確認できます。</p></div></div>` : '';
  return `<article class="ad" id="ad-${esc(a.key)}">
    <div class="adhead"><div><div class="adno">${esc(a.pack)}・${esc(a.id)}　<span class="st st-${st}">${STL[st] || st}</span></div>
      <h3>${esc(a.title)}</h3>
      <div class="meta"><span>型 <b>${esc(a.format)}</b></span><span>話し手 <b>${esc(a.who)}</b></span></div>
      <div class="layer"><b>狙う層：</b>${esc(P.name || '')}｜${esc(P.layer || '')}</div></div>
      ${readyBlock(a)}</div>
    ${decide}${deliv}
    <details class="script"><summary>台本と使う素材を見る（${a.rows.length}行）</summary>
      <div class="tblwrap"><table><thead><tr><th>秒</th><th>段</th><th>ナレーション／字幕</th><th>画</th>${hasMade ? '<th>完成画</th>' : ''}<th>使う素材</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${a.body ? `<div class="body"><b>広告の本文：</b>\n${esc(a.body)}</div>` : ''}</details>
  </article>`;
}
function render(){ try { draw(); } catch (e) { $('#app').innerHTML = '<div class="empty">画面の表示でエラーが出ました：' + esc(e?.message || e) + '（Claude に伝えてください）</div>'; } }
function draw(){
  const app = $('#app'), O = state.ov;
  if (!O) { app.innerHTML = `<div class="empty">${esc(state.loadError || '読み込んでいます…')}</div>`; return; }
  const P = O.plan, S = O.series, items = Object.values(state.items).sort((a, b) => a.order - b.order);
  const sts = items.map(eff);
  const c = {wait: sts.filter(s => s === 'script').length, go: sts.filter(s => s === 'approved' || s === 'producing').length, done: sts.filter(s => s === 'delivered' || s === 'checked').length};
  $('#counts').innerHTML = [['wait','承認待ち',c.wait],['go','制作中',c.go],['done','納品',c.done]].map(([k, l, v]) => `<button class="cnt" data-filter="${k}" aria-pressed="${state.filter === k}">${l}<b>${v}</b></button>`).join('');
  const w1 = weekSum(S, '2026-09-19', '2026-09-25'), w2 = weekSum(S, '2026-09-26', '2026-09-30');
  const dd = (a, b, inv) => { const p = b ? (a - b) / b * 100 : 0; const bad = inv ? p > 0 : p < 0; return `<span class="d ${bad ? 'bad' : 'good'}">${p > 0 ? '+' : ''}${p.toFixed(0)}%</span>`; };
  const packs = O.packs.map(p => {
    const its = items.filter(a => a.pack === p.id);
    const done = its.filter(a => ['delivered','checked'].includes(eff(a))).length;
    if (p.id === 'pack0') return `<div class="pack"><div class="row"><span class="pid">${p.id}</span><span class="flag ok">8本 用意済み</span></div><h3>${esc(p.name)}</h3><p>${esc(p.layer)}</p>
      <table class="win"><thead><tr><th>広告</th><th class="num">購入</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead><tbody>${O.winners.map(w => `<tr><td>${esc(w.code)}</td><td class="num">${w.buy}</td><td class="num">${w.cpa ? yen(w.cpa) : '—'}</td><td class="num">${w.roas.toFixed(2)}</td></tr>`).join('')}</tbody></table>
      <p style="font-size:11.5px">直近3週間の実績（Meta）</p></div>`;
    const flag = done ? `<span class="flag ok">納品 ${done}本</span>` : `<span class="flag bad">配信できる動画 0本</span>`;
    return `<div class="pack ${done ? '' : 'empty'}"><div class="row"><span class="pid">${p.id}</span>${flag}</div><h3>${esc(p.name)}</h3><p>${esc(p.layer)}</p>
      <ul class="plist">${its.map(a => { const k = kinds(a), n = a.rows.length, ok = READY.reduce((s, x) => s + (k[x] || 0), 0);
        return `<li><a href="#ad-${esc(a.key)}">${esc(a.id)} ${esc(a.title)}</a><span class="m"><span class="st st-${eff(a)}">${STL[eff(a)]}</span> 素材${Math.round(100 * ok / n)}%</span></li>`; }).join('')}</ul></div>`; }).join('');
  const show = items.filter((a, i) => state.filter === 'all' || (state.filter === 'wait' && sts[i] === 'script') || (state.filter === 'go' && ['approved','producing'].includes(sts[i])) || (state.filter === 'done' && ['delivered','checked'].includes(sts[i])) || state.filter === a.pack);
  app.innerHTML = `
    <div class="hero"><div class="eyebrow">${esc(P.today)}　数字の取得：${esc(P.fetched)}（Meta・読み取りのみ）</div>
      <h1>${esc(P.headline)}</h1>
      <div class="stop"><b>いまの状態</b><span>${esc(P.status_note)}</span></div>${state.dbNote ? `<div class="stop" style="background:var(--bad-wash)"><b>承認</b><span>${esc(state.dbNote)}</span></div>` : ''}</div>
    <section id="flow"><div class="sh"><h2>流れ：過去3週間とこれからの7日</h2><span>1日ごとではなく、流れで見る</span></div>
      <div class="panel">
        <div class="kpis">
          <div class="kpi"><div class="l">広告費（9/26〜30・1日平均）</div><div class="v">${yen(w2.sp / 5)}</div>${dd(w2.sp / 5, w1.sp / 7)} <span class="d" style="color:var(--sub)">前の週比</span></div>
          <div class="kpi"><div class="l">購入（1日平均）</div><div class="v">${(w2.b / 5).toFixed(1)}件</div>${dd(w2.b / 5, w1.b / 7)}</div>
          <div class="kpi"><div class="l">CPA</div><div class="v">${yen(w2.cpa)}</div>${dd(w2.cpa, w1.cpa, true)} <span class="d" style="color:var(--sub)">目標 ${yen(P.target_cpa)}</span></div>
          <div class="kpi"><div class="l">ROAS</div><div class="v">${w2.roas.toFixed(2)}</div>${dd(w2.roas, w1.roas)}</div>
        </div>
        <div class="chartbox">${chart(S, P)}</div>
        <div class="legend"><span><i class="sw" style="background:var(--spend)"></i>広告費</span><span><i class="sw" style="background:var(--ink)"></i>購入件数</span><span><i class="sw" style="background:var(--accent)"></i>CPA</span><span><i class="sw" style="background:var(--warn)"></i>ROAS（右の目盛り）</span><span><i class="sw" style="background:var(--future);border:1px solid var(--line)"></i>これから</span></div>
        <ol class="events">${O.events.map((e, k) => `<li><span class="n">${k + 1}</span><span class="dt">${esc(e.d.slice(5).replace('-', '/'))}</span><span>${esc(e.t)}</span></li>`).join('')}</ol>
        <div class="week">${P.days.map((d, k) => `<div class="wd ${d.kind} ${k === 0 ? 'today' : ''}"><b>${esc(d.d)}<i>${{make:'作る',run:'出す',check:'見る'}[d.kind]}</i></b>${esc(d.what)}</div>`).join('')}</div>
      </div></section>
    <section id="packs"><div class="sh"><h2>パックの地図</h2><span>どの層に、どの動画が入っているか・足りないか</span></div><div class="packs">${packs}</div></section>
    <section id="make"><div class="sh"><h2>作る動画：台本と素材</h2><span>承認した動画だけ制作します。素材は 素材庫 → フリー素材 → YouTube → どうしても無い時だけAI</span></div>
      <div class="filters">${[['all','すべて']].concat(O.packs.filter(p => p.id !== 'pack0').map(p => [p.id, p.id + ' ' + p.name])).map(([k, l]) => `<button data-filter="${k}" aria-pressed="${state.filter === k}">${esc(l)}</button>`).join('')}</div>
      <div class="adlist">${show.map(adCard).join('') || '<div class="empty">この条件の動画はありません。</div>'}</div></section>`;
}
document.addEventListener('click', async e => {
  const f = e.target.closest('[data-filter]');
  if (f) { state.filter = state.filter === f.dataset.filter ? 'all' : f.dataset.filter; render(); if (f.closest('.counts')) $('#make')?.scrollIntoView({behavior:'smooth'}); return; }
  const p = e.target.closest('[data-part]');
  if (p) { state.part[p.dataset.id] = +p.dataset.part; render(); $('#vid-' + CSS.escape(p.dataset.id))?.play?.().catch(() => {}); return; }
  const b = e.target.closest('[data-v]');
  if (b && state.db) { const id = b.dataset.id, note = ($('#memo-' + CSS.escape(id))?.value || '').trim();
    document.querySelectorAll(`[data-id="${CSS.escape(id)}"][data-v]`).forEach(x => x.disabled = true);
    try { await state.db.doc('decisions/' + id).set({verdict: b.dataset.v, note, at: Date.now(), by: state.uid || ''}); }
    catch (err) { if (err?.code === 'invalid_argument') state.canWrite = false; render(); } }
});
const memoT = {};
document.addEventListener('input', e => { const t = e.target; if (!t.id?.startsWith('memo-') || !state.db) return;
  const id = t.id.slice(5); clearTimeout(memoT[id]);
  memoT[id] = setTimeout(async () => { const d = state.dec[id]; if (!d || (d.note || '') === t.value.trim()) return; try { await state.db.doc('decisions/' + id).update({note: t.value.trim()}); } catch {} }, 900); });
function keep(fn){ const a = document.activeElement, id = a?.id, s = a?.selectionStart; fn(); if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(s, s); } catch {} } } }
async function loadData(){
  // 数字と台本はページと一緒に公開した data/ のファイルから読む（毎朝 Claude が差し替えて再公開する）
  try {
    const [o, it] = await Promise.all([fetch('data/overview.json').then(r => r.json()), fetch('data/items.json').then(r => r.json())]);
    state.ov = o; state.items = it;
  } catch (e) { state.loadError = 'データのファイルを読み込めませんでした（' + (e?.message || e) + '）'; }
  render();
}
(async () => {
  await loadData();
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  state.db = db;
  if (user) { try { state.uid = await user.id(); if (await user.can('data.write') === false) state.canWrite = false; } catch {} }
  if (!db) { state.dbNote = 'この表示では承認ボタンが使えません（claude.ai にサインインして開いてください）'; render(); return; }
  db.collection('decisions').onSnapshot(s => { state.dec = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); keep(render); }, e => { state.dbNote = '承認の保存先に接続できませんでした（' + (e?.code || '') + '）'; render(); });
  render();
})();
</script>
